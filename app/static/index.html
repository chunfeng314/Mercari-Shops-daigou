<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta
      name="description"
      content="煤炉代购工作台 · 日本选品、中国找货、上架与订单履约"
    />
    <title>煤炉 · 代购工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23eb6552'/%3E%3Cpath d='M18 43V22l14 13 14-13v21' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/style.css?v=4" />
    <script src="/static/app.js?v=10" defer></script>
    <script src="/static/backend-ui.js?v=12" defer></script>
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <a href="#dashboard" class="brand"
        ><span class="brand-mark">m<span>·</span></span
        ><span>煤炉<span class="brand-sub">代购工作台</span></span></a
      >
      <div class="workspace">
        <span class="workspace-icon">煤</span>
        <div>我的代购业务<small>Mercari Shops 工作空间</small></div>
        <span class="online-dot" title="本地工作空间"></span>
      </div>
      <p class="nav-label">工作空间</p>
      <nav id="nav" aria-label="主要导航"></nav>
      <div class="sidebar-bottom">
        <div class="workflow-note">
          <span class="small-label">从发现到履约</span>
          <p>日本选品 → 中国找货<br />→ 煤炉上架 → 订单履约</p>
          <div class="mini-route">
            <span>JP</span><i></i><span>CN</span><i></i><span>JP</span>
          </div>
        </div>
        <a class="api-link" href="/docs" target="_blank" rel="noopener"
          >API 文档 <span>↗</span></a
        >
        <div class="profile">
          <span class="avatar">代</span>
          <div>本地工作空间<small>数据保存在本机</small></div>
          <span class="local-tag">LOCAL</span>
        </div>
      </div>
    </aside>
    <div class="app-shell">
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="icon-button mobile-menu"
            id="mobile-menu"
            aria-label="打开导航"
          >
            ☰</button
          ><span>工作空间</span><span class="crumb-slash">/</span
          ><strong id="breadcrumb">业务概览</strong>
        </div>
        <div class="topbar-right">
          <span class="connection" id="connection"><i></i>正在连接</span
          ><span class="divider"></span><span id="today"></span
          ><button
            class="icon-button"
            id="refresh"
            title="刷新数据"
            aria-label="刷新数据"
          ></button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading">
          <span class="spinner"></span>正在读取工作空间…
        </div>
      </main>
      <footer class="page-footer">
        <span>煤炉 · 把好物带到更远的地方</span
        ><span>日本选品 / 中国找货 / 煤炉上架</span>
      </footer>
    </div>
    <div id="overlay-root"></div>
    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
